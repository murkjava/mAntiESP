# дополнительные настройки скрытия
hide:
  # при включенном значении будет скрывать игроков всегда
  # при выключенном значении не будет скрывать игроков, у которых виден nametag
  ignore-nametag: false
  # игнорирование режима спектатора
  ignore-spectator: true
  # игнорирование эффекта свечения
  ignore-glowing: false
  # скрывать сущностей полностью, если у игрока есть эффект слепоты
  blindness: true
  # дистанция слепоты в блоках, дальше которой сущность скрывается полностью
  blindness-distance: 5.0
  # скрывать броню и экипировку сущностей, если игрок в лаве
  in-lava: true
  # дистанция в лаве в блоках, дальше которой с сущности снимается броня и экипировка
  lava-distance: 5.0

# расширение хитбокса сущности по осям (X, Y, Z) в блоках при рейтрейсе
# позволяет раньше обнаружить игрока, выглядывающего из-за угла или через щели
# можно указать одно число для всех осей (например: 0.25) либо настроить каждую ось отдельно
hitbox-expansion:
  x: 0.25
  y: 0.2
  z: 0.25

# предикт (экстраполяция) движения игрока при рейтрейсе
# позволяет заранее обнаружить игрока, выбегающего из-за угла или препятствия
movement-prediction:
  enabled: true
  # на сколько сильно экстраполировать (множитель вектора движения в тиках)
  multiplier: 1.5

