# раз в сколько тиков проверять видимость сущностей
# 1 тик = 50 мс
# чем ниже, тем больше нагрузка на сервер; очень частая проверка на доступность
# чем выше, тем меньше нагрузка, но более долгая проверка доступности видимости
ticks-period: 3
# скрывать ли только игроков?
# при false значении нагрузка на сервер может сильно увеличиться
only-player: true

# работает только при "only-player: false"
# напишите all, чтобы скрывать всех сущностей (может сильно повлиять на производительность)
# либо напишите только тех сущностей, которых надо скрывать
entities-list:
  - "player"
  - "villager"

min-distance: 3.0 # дистанция, после которой начинается raytrace
max-distance: 64.0 # дистанция, после которой raytrace не будет запускаться, а сущность будет скрыта

# миры, в которых antiesp не работает
# лучше укажите сюда мир спавна, и прочие миры, где есть большие скопления игроков
disabled-worlds:
  - "example_world"

# блоки, которые считаются прозрачными
transparent-blocks:
  - "GLASS"
  - "GLASS_PANE"
  - "WHITE_STAINED_GLASS"
  - "ORANGE_STAINED_GLASS"
  - "MAGENTA_STAINED_GLASS"
  - "LIGHT_BLUE_STAINED_GLASS"
  - "YELLOW_STAINED_GLASS"
  - "LIME_STAINED_GLASS"
  - "PINK_STAINED_GLASS"
  - "GRAY_STAINED_GLASS"
  - "LIGHT_GRAY_STAINED_GLASS"
  - "CYAN_STAINED_GLASS"
  - "PURPLE_STAINED_GLASS"
  - "BLUE_STAINED_GLASS"
  - "BROWN_STAINED_GLASS"
  - "GREEN_STAINED_GLASS"
  - "RED_STAINED_GLASS"
  - "BLACK_STAINED_GLASS"
  - "IRON_BARS"
  - "CHAIN"
  - "ICE"
  - "BARRIER"

# дополнительные настройки скрытия
hide:
  # при включенном значении будет скрывать игроков всегда
  # при выключенном значении не будет скрывать игроков, у которых виден nametag
  ignore-nametag: false
  # игнорирование режима спектатора
  ignore-spectator: true
  # игнорирование эффекта свечения
  ignore-glowing: false
  # скрывать сущностей полностью, если у игрока есть эффект слепоты
  blindness: true
  # дистанция слепоты в блоках, дальше которой сущность скрывается полностью
  blindness-distance: 5.0
  # скрывать сущностей, если игрок в лаве
  in-lava: true
  # дистанция в лаве в блоках, дальше которой сущность скрывается полностью
  lava-distance: 5.0

# расширение хитбокса сущности по осям (X, Y, Z) в блоках при рейтрейсе
# позволяет раньше обнаружить игрока, выглядывающего из-за угла или через щели
# можно указать одно число для всех осей (например: 0.25) либо настроить каждую ось отдельно
hitbox-expansion:
  x: 0.25
  y: 0.2
  z: 0.25

# предикт (экстраполяция) движения игрока при рейтрейсе
# позволяет заранее обнаружить игрока, выбегающего из-за угла или препятствия
movement-prediction:
  enabled: true
  # на сколько сильно экстраполировать (множитель вектора движения в тиках)
  multiplier: 1.5

