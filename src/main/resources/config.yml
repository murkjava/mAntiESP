# раз в сколько тиков проверять видимость сущностей
# 1 тик = 50 мс
# чем ниже, тем больше нагрузка на сервер; очень частая проверка на доступность
# чем выше, тем меньше нагрузка, но более долгая проверка доступности видимости
ticks-period: 3
# скрывать ли только игроков?
# при false значении нагрузка на сервер может сильно увеличиться
only-player: true

# работает только при "only-player: false"
# напишите all, чтобы скрывать всех сущностей (может сильно повлиять на производительность)
# либо напишите только тех сущностей, которых надо скрывать
entities-list:
  - "player"
  - "villager"

# поддержка вида от третьего лица (F5)
# учитывает положение камеры сзади и спереди игрока при рейтрейсе
# может быть чуть затратнее, чем без включенной опции
f5:
  enabled: true
  # дистанция камеры в блоках (в ванильном майнкрафте 4.0)
  distance: 4.0
  # отступ от блоков при столкновении камеры (в блоках)
  collision-offset: 0.1
  # проверять вид спереди (селфи-камера)
  front-view: true

min-distance: 3.0 # дистанция, после которой начинается raytrace
max-distance: 64.0 # дистанция, после которой raytrace не будет запускаться, а сущность будет скрыта

# миры, в которых antiesp не работает
# лучше укажите сюда мир спавна, и прочие миры, где есть большие скопления игроков
disabled-worlds:
  - "example_world"

# блоки, которые считаются прозрачными (луч проходит сквозь них)
# можно указывать как точные названия блоков (например: ICE, BARRIER),
# так и ключевые слова / маски (например: DOOR, FENCE, BUTTON, LEAVES, *GLASS*)
transparent-blocks:
  - "GLASS"
  - "PANE"
  - "LEAVES"
  - "FENCE"
  - "GATE"
